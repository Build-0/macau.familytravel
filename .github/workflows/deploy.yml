name: Build trips

# 建置行程程式(trip/)同分享預覽頁(t/<slug>/),將結果直接提交返 main,由 GitHub Pages(分支發佈)一齊發佈。
# 咁就唔使改 Pages 設定,亦唔會有「兩個部署互相覆蓋」嘅問題。
on:
  push:
    branches: [main]
    paths: ['trip-app/**', '.github/workflows/deploy.yml']
  workflow_dispatch:
  # 每 15 分鐘睇一次行程有冇改過,有改先重新建置(行程改動時 Supabase Edge Function trip-sync 亦會即時觸發)
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: build-trips
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: c
        name: 檢查行程有冇改過
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          URL=$(grep -oP "SUPABASE_URL\s*=\s*'\K[^']+" trip-app/src/supabase.js)
          KEY=$(grep -oP "SUPABASE_ANON_KEY\s*=\s*'\K[^']+" trip-app/src/supabase.js)
          NEW=$(curl -fsS "$URL/rest/v1/trips?select=slug,title,data,updated_at&published=eq.true&order=slug" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" | sha256sum | cut -c1-16) || NEW=""
          OLD=$(curl -fsS "https://build-0.github.io/macau.familytravel/share-manifest.json" | jq -r .hash 2>/dev/null) || OLD="none"
          echo "live=$OLD now=$NEW"
          if [ -n "$NEW" ] && [ "$NEW" != "$OLD" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; else echo "build=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.c.outputs.build == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: trip-app/package-lock.json
      - name: 建置行程程式
        if: steps.c.outputs.build == 'true'
        working-directory: trip-app
        run: npm ci && npm run build
      - name: 生成 trip/ 同 t/(分享預覽頁 + 鏡像相片)
        if: steps.c.outputs.build == 'true'
        run: |
          rm -rf trip t share-manifest.json share-report.json
          cp -r trip-app/dist trip
          (cd trip-app && OUT=.. node scripts/gen-share.mjs)
      - name: 提交建置結果
        if: steps.c.outputs.build == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A trip t share-manifest.json share-report.json
          if git diff --cached --quiet; then echo "冇變化"; exit 0; fi
          git commit -m "自動建置行程頁與分享預覽頁"
          git pull --rebase -q
          git push
