<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>仁仁德德去哪裡</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: phone-first feed. Two single-choice rows on top (who, then when), then poster-led cards; details fold away. Palette: Macau azulejo blue + egg-tart gold. */
:root{
  --bg:#eef2f8; --surface:#ffffff; --ink:#152038; --muted:#5d6780; --line:#dbe2ee;
  --tile:#1f4f9c; --tile-soft:#e3ebf8; --gold:#f0a92a; --gold-soft:#fdf0d6;
  --go:#1c7a4e; --go-soft:#dff2e8; --maybe:#1f4f9c; --maybe-soft:#e3ebf8; --warn:#b2452f; --warn-soft:#fbe6df;
  --baby:#b5578a; --baby-soft:#f8e4ef; --shade:rgba(10,18,36,.55);
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --num:"Baloo 2","Noto Sans TC",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1220; --surface:#161d30; --ink:#e9eef8; --muted:#9aa5bd; --line:#28324a;
  --tile:#8db1f0; --tile-soft:#1c2843; --gold:#f4bd52; --gold-soft:#3a2d13;
  --go:#6fd3a0; --go-soft:#14321f; --maybe:#8db1f0; --maybe-soft:#1c2843; --warn:#f29a85; --warn-soft:#3a1c17;
  --baby:#ee9ac6; --baby-soft:#3a1a2c; --shade:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1220; --surface:#161d30; --ink:#e9eef8; --muted:#9aa5bd; --line:#28324a;
  --tile:#8db1f0; --tile-soft:#1c2843; --gold:#f4bd52; --gold-soft:#3a2d13;
  --go:#6fd3a0; --go-soft:#14321f; --maybe:#8db1f0; --maybe-soft:#1c2843; --warn:#f29a85; --warn-soft:#3a1c17;
  --baby:#ee9ac6; --baby-soft:#3a1a2c; --shade:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:16px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-size:26px;font-weight:900;margin:0;line-height:1.2;letter-spacing:.02em}
.upd{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.tiles{height:8px;border-radius:4px;background:repeating-linear-gradient(90deg,var(--tile) 0 8px,transparent 8px 12px,var(--gold) 12px 20px,transparent 20px 24px)}
.warn{background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:500}

/* row 1: who */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px}
.seg button{border:0;background:none;border-radius:12px;padding:9px 4px;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--muted)}
.seg button i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:900;color:#fff}
#w-ren i{background:var(--go)} #w-de i{background:var(--baby)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg.two{grid-template-columns:repeat(2,1fr)}
.day.rng{flex:1 0 74px;justify-content:center}
.day.rng .dn{font-family:var(--font);font-size:16px;font-weight:900;line-height:1.3}
#segreg button[aria-pressed="true"]{background:var(--tile);color:#fff}

/* row 2: when */
.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.day{flex:0 0 52px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:6px 0 7px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:1px}
.day .wd{font-size:11px;color:var(--muted)}
.day .dn{font-family:var(--num);font-weight:800;font-size:20px;line-height:1.15}
.day .cnt{font-size:11px;font-weight:700;color:var(--maybe)}
.day .cnt.a{color:#a86a00}
.day.we .wd,.day.we .dn{color:var(--warn)}
.day.quick{flex-basis:66px;justify-content:center}
.day.quick .dn{font-family:var(--font);font-size:15px;font-weight:900;line-height:1.3}
.day.gap{flex:0 0 1px;padding:0;border:0;background:var(--line);cursor:default;margin:6px 2px}
.day[aria-pressed="true"]{background:var(--tile);border-color:var(--tile)}
.day[aria-pressed="true"] .wd,.day[aria-pressed="true"] .dn,.day[aria-pressed="true"] .cnt{color:var(--bg)}

/* alerts */
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;text-decoration:none}
.alert .ic{flex:0 0 38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:var(--warn-soft)}
.alert.reg .ic{background:var(--gold-soft)}
.alert b{display:block;font-size:14px;line-height:1.35}
.alert span{display:block;font-size:13px;color:var(--muted);line-height:1.4}
.alert .go{margin-left:auto;font-size:18px;color:var(--tile);font-weight:700}

section{display:flex;flex-direction:column;gap:14px}
h2{font-size:18px;font-weight:900;margin:0 0 -6px;display:flex;align-items:center;gap:8px}
h2 i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:900;color:#fff}
#sec-ren h2 i{background:var(--go)} #sec-de h2 i,#sec-with h2 i{background:var(--baby)} #sec-with h2 i.o{background:none;color:var(--baby);border:2px solid var(--baby)}
h2 small{font-size:12px;font-weight:500;color:var(--muted)}
.feed{display:flex;flex-direction:column;gap:16px}

/* card */
.card{background:var(--surface);border-radius:20px;overflow:hidden;border:1px solid var(--line)}
.hero{position:relative;height:210px;background:var(--tile-soft);overflow:hidden}
.hero .bgimg{position:absolute;inset:-20px;width:calc(100% + 40px);height:calc(100% + 40px);object-fit:cover;filter:blur(18px) saturate(1.2);opacity:.9;max-width:none}
.hero .fg{position:relative;display:block;height:100%;max-width:100%;margin:0 auto;object-fit:contain;padding:14px 0;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
.hero .noimg{height:100%;display:grid;place-items:center;font-size:56px}
.grade{position:absolute;top:10px;left:10px;display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:3px 10px 3px 3px;font-size:13px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.grade b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--num);font-size:19px;font-weight:800;color:#fff;background:var(--maybe)}
.grade.A b{background:var(--gold);color:#2a1d02}
.flags{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.flag{border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;background:var(--gold);color:#2a1d02;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.flag.sold{background:var(--warn);color:#fff}
.flag.upd{background:var(--tile);color:#fff}
.date{position:absolute;left:10px;bottom:10px;background:var(--shade);color:#fff;border-radius:14px;padding:4px 12px 6px;backdrop-filter:blur(6px);line-height:1}
.date small{display:block;font-size:11px;opacity:.85;margin-bottom:2px}
.date span{font-family:var(--num);font-weight:800;font-size:26px}
.cap{position:absolute;right:10px;bottom:10px;font-size:10px;color:#fff;background:var(--shade);border-radius:6px;padding:2px 6px}

.cbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.cbody h3{margin:0;font-size:18px;font-weight:900;line-height:1.35;text-wrap:balance}
.hook{margin:-4px 0 0;font-size:14px;color:var(--muted)}
.facts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.facts span{display:inline-flex;align-items:center;gap:5px;min-width:0}
.facts svg{flex:0 0 16px;width:16px;height:16px;stroke:var(--tile);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.who{display:flex;flex-wrap:wrap;gap:8px}
.kid{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px 3px 3px;font-size:13px;font-weight:700}
.kid i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:900;color:#fff}
.kid.ren{background:var(--go-soft);color:var(--go)} .kid.ren i{background:var(--go)}
.kid.ren.lite{background:var(--maybe-soft);color:var(--maybe)} .kid.ren.lite i{background:var(--maybe)}
.kid.de{background:var(--baby-soft);color:var(--baby)} .kid.de i{background:var(--baby)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:12px;border-radius:999px;padding:2px 9px;background:var(--bg);color:var(--muted)}
.actions{display:flex;align-items:center;gap:10px}
.btn{flex:1;text-align:center;text-decoration:none;font-weight:700;font-size:14px;border-radius:12px;padding:9px 12px;background:var(--tile);color:var(--bg)}
.rel{font-size:12px;color:var(--muted);white-space:nowrap}
details.more{border-top:1px dashed var(--line);padding-top:8px}
details.more summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--tile);list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:" ＋"}
details.more[open] summary::after{content:" －"}
details.more dl{margin:8px 0 0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:13px}
details.more dt{color:var(--muted);white-space:nowrap}
details.more dd{margin:0;min-width:0;overflow-wrap:anywhere}
details.more .links{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:13px}
details.more .links a{color:var(--tile);font-weight:700;text-decoration:none}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:18px;background:var(--surface);border-radius:16px;border:1px dashed var(--line);margin:0}

details.log{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:13px}
details.log summary{cursor:pointer;font-weight:700;color:var(--muted)}
details.log h4{margin:12px 0 4px;font-size:13px}
details.log p{margin:0 0 6px;color:var(--muted)}
details.log a{color:var(--tile);font-weight:700;text-decoration:none}
footer{font-size:12px;color:var(--muted);text-align:center}

/* compact list rows */
.feed{gap:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:flex;gap:12px;padding:14px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.th{flex:0 0 96px;height:96px;border-radius:14px;overflow:hidden;background:var(--tile-soft);display:grid;place-items:center}
.th img{width:100%;height:100%;object-fit:cover}
.th .ph{font-size:38px}
.rb{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.rb h3{margin:0;font-size:17px;font-weight:900;line-height:1.3}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px;background:var(--bg);color:var(--muted)}
.chip.ga{background:var(--gold-soft);color:#8a5600}.chip.gb{background:var(--maybe-soft);color:var(--maybe)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.new{background:var(--gold);color:#2a1d02}.chip.upd{background:var(--tile);color:#fff}
.rb p{margin:0;font-size:14px;line-height:1.45}
.rb .sm{color:var(--muted)}
.rb .bk{font-size:13px}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.key{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;border-radius:10px;padding:3px 9px;background:var(--bg);color:var(--ink)}
.key.age{background:var(--go-soft);color:var(--go)}
.key.need{background:var(--gold-soft);color:#8a5600}
.key.free{background:var(--go-soft);color:var(--go)}
.key.stop{background:var(--warn-soft);color:var(--warn)}
.key small{font-weight:500;font-size:12px;opacity:.85}
.rb .btn{align-self:flex-start;flex:none;padding:6px 14px;font-size:13px;margin-top:2px}
.rb .who{gap:6px}.rb .kid{font-size:12px}
.rb details.more{border-top:0;padding-top:0}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 12px;display:flex;flex-direction:column}
.box>summary{cursor:pointer;font-weight:900;font-size:15px;padding:8px 0;list-style:none}
.box>summary::-webkit-details-marker{display:none}
.box>summary::after{content:" ＋";color:var(--tile)} .box[open]>summary::after{content:" －"}
.al{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);text-decoration:none;font-size:13px;line-height:1.45}
.box>.al:first-child{border-top:0}
.al b{font-size:14px} .al em{font-style:normal;color:var(--warn);font-weight:700}
.al .gA,.al .gB{flex:0 0 24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:13px}
.al .gA{background:var(--gold);color:#2a1d02}.al .gB{background:var(--maybe-soft);color:var(--maybe)}
.alerts{gap:10px}
.row{border-left:5px solid var(--go)} .row.pl{border-left-color:var(--baby)}
.feed.de .row,#dewith .row{border-left-color:var(--baby)}
.kid.de.o{background:none;border:1.5px solid var(--baby)} .kid.de.o i{background:none;color:var(--baby);border:1.5px solid var(--baby)}
.kid.no{background:var(--bg);color:var(--muted);padding:3px 10px}
#sec-de .empty{background:var(--baby-soft);border-color:var(--baby);color:var(--baby)}
/* alert rows with poster thumbs */
.al{align-items:center}
.al .tb{position:relative;flex:0 0 60px;height:60px;border-radius:12px;overflow:hidden;background:var(--tile-soft);display:grid;place-items:center;font-size:26px}
.al .tb img{width:100%;height:100%;object-fit:cover}
.al .tb .gA,.al .tb .gB{position:absolute;left:3px;top:3px;flex:none;width:20px;height:20px;font-size:11px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.al .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.al .tx b{font-size:14px;line-height:1.35}
.al .tx .d{color:var(--muted);font-size:12.5px}
.al .tx em{font-size:12.5px}
.al .tx .nw{font-style:normal;background:var(--gold);color:#2a1d02;border-radius:999px;padding:0 6px;font-size:11px;font-weight:800;margin-right:4px}
.al .ar{flex:0 0 auto;color:var(--tile);font-weight:700;font-size:16px}
</style>

<div class="wrap">
  <header style="display:flex;flex-direction:column;gap:12px">
    <div class="tiles" aria-hidden="true"></div>
    <div class="top"><h1>仁仁德德去哪裡</h1><div class="upd" id="upd">—</div></div>
    <div class="warn" id="warn" hidden></div>
    <div class="seg two" id="segwho" role="group" aria-label="看誰">
      <button id="w-ren" data-w="ren" aria-pressed="true"><i>仁</i>仁仁專區</button>
      <button id="w-de" data-w="de" aria-pressed="false"><i>德</i>德德專區</button>
    </div>
    <div class="seg two" id="segreg" role="group" aria-label="報名方式">
      <button data-r="reg" aria-pressed="true">📝 要報名</button>
      <button data-r="walk" aria-pressed="false">🚶 現場參加</button>
    </div>
    <div class="strip" id="strip" role="group" aria-label="選日期"></div>
  </header>

  <div class="alerts" id="alerts"></div>

  <section id="sec-ren"><h2><i>仁</i>仁仁專區 <small id="ren-count"></small></h2><div class="feed" id="renren"><p class="empty">載入中…</p></div></section>
  <section id="sec-de"><h2><i>德</i>德德專區 <small>專為嬰兒設計，德德可親身參與</small></h2><div class="feed de" id="dede"></div></section>
  <section id="sec-with"><h2><i class="o">德</i>德德可隨行 <small>跟哥哥同行，可推嬰兒車</small></h2><div class="feed" id="dewith"></div></section>
  <section id="sec-radar" hidden><h2>📝 報名雷達 <small id="radar-sub"></small></h2><div class="feed" id="radar"></div></section>

  <details class="log" id="log"><summary id="log-sum">查證紀錄</summary><div id="log-body"></div></details>
  <footer>逢星期一、五上午更新｜資料以主辦方最新公布為準</footer>
</div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const REL={official:"✅ 官方核實",social:"🟡 官方社交平台",aggregator:"⚪ 待官方確認"};
  const TAGI={"車車":"🚗","恐龍":"🦕","動物":"🐾","高互動":"🙌","接觸其他小朋友":"👫","親手做":"✋","演出":"🎭","音樂":"🎵"};
  const CATI={"演出":"🎭","嘉年華":"🎡","文化體驗":"🏮","主題活動":"🚒","市集":"🛍️","工作坊":"✂️"};
  const WD=["日","一","二","三","四","五","六"];
  const ICON={
    time:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    pin:'<svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
    fee:'<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>'};
  let data=null, who="ren", regMode="reg", when="all", R={}, regItems=[], weekendSet=[], urgMap={}, radarN=0;
  try{who=localStorage.getItem("kidsWho")||"ren"}catch(e){}
  if(who!=="ren"&&who!=="de") who="ren";
  const isWalk=e=>/免報名|現場|候補/.test(e.reg||"")||(!e.reg&&!e.booking);
  const inReg=e=>regMode==="walk"?isWalk(e):!isWalk(e);

  const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
  const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const lvl=e=>e.dede_level||(e.dede?"enter":"");
  const allItems=()=>[...(data.renren||[]),...(data.dede||[])];
  const inWhen=e=>{if(when==="all")return true;const ds=(e.days||[]).filter(d=>d>=R.s);
    if(when==="this")return ds.some(d=>d<=R.sun); if(when==="next")return ds.some(d=>d>R.sun&&d<=R.nsun); return ds.some(d=>d>R.nsun)};
  function computeRanges(){const s=parse(data.window_start||data.updated||iso(new Date()));const sun=new Date(s);sun.setDate(s.getDate()+(7-s.getDay())%7);
    const nsun=new Date(sun);nsun.setDate(sun.getDate()+7);const ns=new Date(sun);ns.setDate(sun.getDate()+1);const ls=new Date(nsun);ls.setDate(nsun.getDate()+1);
    return {s:iso(s),sun:iso(sun),nsun:iso(nsun),lab:{this:`${s.getMonth()+1}/${s.getDate()}–${sun.getDate()}`,next:`${ns.getMonth()+1}/${ns.getDate()}–${nsun.getDate()}`,later:`${ls.getMonth()+1}/${ls.getDate()}起`}}}

  function computeWeekend(){
    const s=parse(data.window_start||data.updated||iso(new Date()));
    const out=[];
    for(let i=0;i<7;i++){const d=new Date(s);d.setDate(s.getDate()+i);if(d.getDay()===6||d.getDay()===0){out.push(iso(d));if(d.getDay()===0)break}}
    return out;
  }
  function dateBlock(e){
    const all=e.days||[]; if(!all.length) return "";
    const showOne=when!=="all"&&when!=="weekend";
    const f=parse(showOne?when:all[0]);
    let main=String(f.getDate());
    if(!showOne&&all.length>1){const l=parse(all[all.length-1]);const consec=(l-f)/864e5===all.length-1;main=consec?`${f.getDate()}–${l.getDate()}`:all.map(x=>parse(x).getDate()).join("・")}
    const sub=(showOne||all.length===1)?` 星期${WD[f.getDay()]}`:"";
    return `<div class="date"><small>${f.getMonth()+1}月${sub}</small><span>${main}</span></div>`;
  }
  function kids(e){
    let h="";const rn=e.renren_note||"";
    if(rn.startsWith("推薦")) h+=`<span class="kid ren"><i>仁</i>推薦參加</span>`;
    else if(rn) h+=`<span class="kid ren lite"><i>仁</i>可入場</span>`;
    const l=lvl(e);
    if(l==="play") h+=`<span class="kid de"><i>德</i>可參與</span>`;
    else if(l==="enter") h+=`<span class="kid de"><i>德</i>可隨行</span>`;
    return h?`<div class="who">${h}</div>`:"";
  }
  function shortDate(e){
    const ds=e.days||[]; if(!ds.length) return esc(e.dates||"");
    const f=parse(ds[0]), l=parse(ds[ds.length-1]);
    const one=d=>`${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`;
    return ds.length===1?one(f):(ds.length===2?`${one(f)}、${l.getDate()}（${WD[l.getDay()]}）`:`${one(f)}–${l.getDate()}（${WD[l.getDay()]}）`);
  }
  function card(e){
    const thumb=e.image?`<img src="${esc(e.image)}" alt="${esc(e.title)} 海報" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'ph',textContent:'${CATI[e.category]||"✨"}'}))">`:`<span class="ph" aria-hidden="true">${CATI[e.category]||"✨"}</span>`;
    const chips=[];
    if(e.grade==="A") chips.push('<span class="chip ga">A 值得專程去</span>'); else if(e.grade==="B") chips.push('<span class="chip gb">B 可以順道去</span>');
    if(urgMap[e.id]) chips.push(`<span class="chip warn">⏰ ${esc(urgMap[e.id])}</span>`);
    if(e.sold_out) chips.push('<span class="chip warn">已售罄</span>');
    else if(urgMap[e.id]){}
    else if(e.status==="closing") chips.push('<span class="chip warn">即將完場／截止</span>');
    else if(e.status==="new") chips.push('<span class="chip new">新</span>');
    else if(e.status==="updated") chips.push('<span class="chip upd">有更新</span>');
    if(e.reliability&&e.reliability!=="official") chips.push(`<span class="chip soft">${e.reliability==="social"?"🟡 主辦社交平台":"⚪ 待確認"}</span>`);
    const rn=e.renren_note||"", l=lvl(e);
    const who=[rn.startsWith("推薦")?'<span class="kid ren"><i>仁</i>推薦參加</span>':rn?'<span class="kid ren lite"><i>仁</i>可入場</span>':"",
      l==="play"?'<span class="kid de"><i>德</i>德德專區</span>':l==="enter"?'<span class="kid de o"><i>德</i>德德可隨行</span>':'<span class="kid no">德德不適合</span>'].join("");
    const ageS=e.age_range||String(e.age||"").replace(/（.*?）/g,"").split(/[；;，,]/)[0];
    const reg=e.reg||(e.booking?"需報名":"");
    const regCls=/免/.test(reg)?"free":/截止|候補|額滿|售罄/.test(reg)?"stop":"need";
    const qS=e.sold_out?"已額滿":(e.quota_short||"");
    const keys=[ageS?`<span class="key age">👧 ${esc(ageS)}</span>`:"",
      reg?`<span class="key ${regCls}">📝 ${esc(reg)}${e.reg_note?` <small>${esc(e.reg_note)}</small>`:""}</span>`:"",
      qS?`<span class="key${e.sold_out?" stop":""}">👥 ${esc(qS)}</span>`:""].join("");
    const main=(e.links||[])[0];
    const rest=(e.links||[]).map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.label)} ↗</a>`).join("");
    const row=(k,v)=>v?`<dt>${k}</dt><dd>${esc(v)}</dd>`:"";
    return `<article class="row ${l==="play"?"pl":""}" id="c-${esc(e.id)}">
      <a class="th" href="${esc(main?main.url:"#")}" target="_blank" rel="noopener">${thumb}</a>
      <div class="rb">
        <h3>${esc(e.title)}</h3>
        <div class="chips">${chips.join("")}</div>
        <p class="ln"><b>${shortDate(e)}</b> ${esc(e.times)}</p>
        <p class="ln">${esc(e.venue_short||e.venue)}・${esc(e.fee)}</p>
        ${keys?`<div class="keys">${keys}</div>`:""}
        <p class="sm">${esc(e.summary)}</p>
        ${who?`<div class="who">${who}</div>`:""}
        <details class="more"><summary>詳細</summary><dl>
          ${e.venue!==e.venue_short?row("地點",e.venue):""}${row("年齡",e.age)}${row("報名",e.booking)}${row("名額",e.quota)}
          ${row("推薦原因",e.grade_basis)}${row("仁仁",rn.replace(/^(推薦參加|可入場)[：:]\s*/,""))}${row("德德",e.dede_note)}${row("來源",(REL[e.reliability]||"")+" "+(e.reliability_note||""))}
        </dl><div class="links">${rest}</div></details>
      </div></article>`;
  }
  const withDe=()=>(data.renren||[]).filter(e=>lvl(e)==="enter");
  function pool(){
    const p=who==="de"?[...(data.dede||[]),...withDe()]:[...(data.renren||[]),...regItems];
    return p.filter(inReg);
  }
  function strip(){
    const items=pool();
    const cnt=list=>{const n=list.length;const a=list.some(e=>e.grade==="A");return n?`<span class="cnt${a?" a":""}">${n}項</span>`:`<span class="cnt">—</span>`};
    const save=when; const c={};
    for(const k of ["all","this","next","later"]){when=k;c[k]=items.filter(inWhen)} when=save;
    const B=(k,name,sub)=>`<button class="day rng" data-d="${k}" aria-pressed="${when===k}">${sub?`<span class="wd">${esc(sub)}</span>`:""}<span class="dn">${name}</span>${cnt(c[k])}</button>`;
    $("strip").innerHTML=B("all","全部","")+B("this","本週",R.lab.this)+B("next","下週",R.lab.next)+B("later","下週之後",R.lab.later);
    $("strip").querySelectorAll("button.day").forEach(b=>b.addEventListener("click",()=>{when=b.dataset.d;render()}));
  }
  function render(){
    const ren=(data.renren||[]).filter(inReg).filter(inWhen), rgs=regItems.filter(inReg).filter(inWhen), de=(data.dede||[]).filter(inReg).filter(inWhen);
    const none=regMode==="walk"?"這段時間沒有免報名、可直接到場的活動":"這段時間沒有需報名的活動";
    $("renren").innerHTML=(ren.length||rgs.length)?ren.map(card).join("")+rgs.map(x=>x.html).join(""):`<p class="empty">${none}</p>`;
    $("dede").innerHTML=de.length?de.map(card).join(""):`<p class="empty">${none}</p>`;
    $("ren-count").textContent=(ren.length+rgs.length)?`${ren.length+rgs.length}項`:"";
    $("sec-ren").hidden=(who==="de");
    $("sec-de").hidden=(who==="ren");
    const wd=withDe().filter(inReg).filter(inWhen);
    $("dewith").innerHTML=wd.length?wd.map(card).join(""):`<p class="empty">${none}</p>`;
    $("sec-with").hidden=(who!=="de");
    $("sec-radar").hidden=true;
    document.querySelectorAll("#segwho button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.w===who)));
    document.querySelectorAll("#segreg button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.r===regMode)));
    strip();
  }
  function miniCard(o){
    const th=o.image?`<img src="${esc(o.image)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'ph',textContent:'${o.ph||"✨"}'}))">`:`<span class="ph" aria-hidden="true">${o.ph||"✨"}</span>`;
    return `<article class="row">
      <a class="th" href="${esc(o.url||"#")}" target="_blank" rel="noopener">${th}</a>
      <div class="rb"><h3>${esc(o.title)}</h3>
        ${o.chips&&o.chips.length?`<div class="chips">${o.chips.join("")}</div>`:""}
        ${(o.lines||[]).map(l=>`<p class="ln">${l}</p>`).join("")}
        ${o.keys?`<div class="keys">${o.keys}</div>`:""}
        ${o.sm?`<p class="sm">${esc(o.sm)}</p>`:""}
        ${o.url?`<a class="btn" href="${esc(o.url)}" target="_blank" rel="noopener">${esc(o.btn||"查看")} ↗</a>`:""}
      </div></article>`;
  }
  function alerts(d){
    const cards=[...(d.renren||[]),...(d.dede||[])];
    const key=t=>String(t||"").replace(/[\s《》「」（）()：:＋+／/]/g,"").slice(0,5);
    const match=x=>cards.find(c=>(c.links||[]).some(l=>l.url===x.url))||cards.find(c=>key(c.title)&&key(x.title).startsWith(key(c.title)));
    urgMap={}; const loose=[];
    const rg=d.register||[]; const rgUrg={};
    (d.urgent||[]).forEach(r=>{const c=match(r); if(c){urgMap[c.id]=r.text;return}
      const k=rg.findIndex(x=>x.url===r.url); if(k>=0){rgUrg[k]=r.text;return} loose.push(r)});
    const gchip=g=>g==="A"?'<span class="chip ga">A 值得專程去</span>':g==="B"?'<span class="chip gb">B 可以順道去</span>':"";
    const uc=loose.map(r=>miniCard({title:r.title,image:r.image,url:r.url,ph:"⏰",btn:"查看",
      chips:[`<span class="chip warn">⏰ ${esc(r.text)}</span>`]})).join("");
    $("alerts").innerHTML="";$("alerts").hidden=true;
    regItems=rg.map((x,k)=>{const m=match(x);return {days:x.days||[],grade:x.grade,reg:"需報名",html:miniCard({title:x.title,image:x.image||(m&&m.image)||"",url:x.url,ph:"📝",btn:"去報名",
      chips:[gchip(x.grade),x.is_new?'<span class="chip new">新</span>':"",rgUrg[k]?`<span class="chip warn">⏰ ${esc(rgUrg[k])}</span>`:""].filter(Boolean),
      lines:[`<b>活動</b> ${esc(x.date)}`],
      keys:[x.age?`<span class="key age">👧 ${esc(x.age)}</span>`:"",`<span class="key stop">📝 ${esc(x.deadline)} 截止</span>`].join(""),
      sm:x.method})}});
    const nn=rg.filter(x=>x.is_new).length;
    $("radar-sub").textContent=rg.length?`${rg.length}項${nn?`・新${nn}`:""}｜15–45日後活動，現在要報名`:"";
    radarN=rg.length;
  }
  function log(d){
    const u=d.unverified||[], x=d.excluded||[], s=d.sources||[];
    $("log-sum").textContent=`查證紀錄｜未查證 ${u.length}・已排除 ${x.length}・來源 ${s.length}`;
    $("log-body").innerHTML=
      `<h4>未查證</h4>${u.length?u.map(r=>`<p><b>${esc(r.title)}</b>：${esc(r.layer)}，${esc(r.reason)}${r.url?` <a href="${esc(r.url)}" target="_blank" rel="noopener">自行查看 ↗</a>`:""}</p>`).join(""):"<p>全部已核實</p>"}`+
      `<h4>已排除（C 不推薦）</h4>${x.length?x.map(r=>`<p><b>${esc(r.title)}</b>：${esc(r.reason)}</p>`).join(""):"<p>—</p>"}`+
      `<h4>資料來源</h4>${s.map(r=>`<p><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.label)} ↗</a></p>`).join("")}`;
  }
  function boot(d){
    data=d; R=computeRanges();
    $("upd").innerHTML=`更新 ${esc(d.updated_label||d.updated)}<br>${esc(d.window_label||"")}`;
    if(d.warning){$("warn").textContent=d.warning;$("warn").hidden=false}
    alerts(d); log(d); render();
  }
  document.querySelectorAll("#segwho button").forEach(b=>b.addEventListener("click",()=>{who=b.dataset.w;try{localStorage.setItem("kidsWho",who)}catch(e){}render()}));
  document.querySelectorAll("#segreg button").forEach(b=>b.addEventListener("click",()=>{regMode=b.dataset.r;render()}));
  const SB="https://nikijysochwdfcqscgby.supabase.co/rest/v1/kids_events?id=eq.current&select=data",SBK="sb_publishable_CXS1oAAM1sTtfalOTFMOTA_FSZwA4gU";
  const local=()=>fetch("data.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});
  fetch(SB,{cache:"no-store",headers:{apikey:SBK}}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()})
    .then(rows=>{if(!rows||!rows[0]||!rows[0].data)throw new Error("empty");return rows[0].data}).catch(local).then(boot)
    .catch(()=>{$("renren").innerHTML='<p class="empty">資料暫時無法載入，請稍後再試。</p>'});
})();
</script>

</html>
