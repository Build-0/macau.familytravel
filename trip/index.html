  </head>
  <body>
    <div id="root"></div>
    <script>
    /* 版本更新偵測:伺服器最新版本比本頁新就彈提示(切返 tab / 定時 check) */
    (function(){
      var myLM = Date.parse(document.lastModified) || Date.now(), notified = false;
      function toast(){
        if(notified) return; notified = true;
        var b=document.createElement('div'); b.setAttribute('role','status');
        b.style.cssText='position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:999999;display:flex;align-items:center;gap:10px;max-width:92vw;padding:12px 14px 12px 18px;background:#171f2c;color:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.3);font:600 14px/1.3 "Noto Sans TC","PingFang TC",system-ui,sans-serif';
        var t=document.createElement('span'); t.textContent='🔄 有新版本'; t.style.whiteSpace='nowrap';
        var go=document.createElement('button'); go.textContent='撳我更新';
        go.style.cssText='padding:7px 15px;border:0;border-radius:99px;background:#2fc8a4;color:#06251f;font:700 14px/1 inherit;cursor:pointer;white-space:nowrap';
        go.onclick=function(){location.reload();};
        var x=document.createElement('span'); x.textContent='×';
        x.style.cssText='cursor:pointer;opacity:.55;font-size:20px;line-height:1;padding:0 2px';
        x.onclick=function(){b.remove();};
        b.appendChild(t); b.appendChild(go); b.appendChild(x); document.body.appendChild(b);
      }
      function check(){
        if(notified||document.hidden) return;
        fetch(location.pathname+location.search,{cache:'no-store',method:'HEAD'})
          .then(function(r){var lm=Date.parse(r.headers.get('last-modified'));if(lm&&lm>myLM+2000)toast();})
          .catch(function(){});
      }
      document.addEventListener('visibilitychange',function(){if(!document.hidden)check();});
      setInterval(check,300000); setTimeout(check,20000);
    })();
    </script>
  </body>
</html>
