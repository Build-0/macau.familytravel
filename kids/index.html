<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>仁仁德德去邊度</title>
<link rel="preconnect" href="https://nikijysochwdfcqscgby.supabase.co" crossorigin>
<link rel="dns-prefetch" href="https://nikijysochwdfcqscgby.supabase.co">
<style>body{margin:0;font:15px "Noto Sans TC","PingFang TC",system-ui,sans-serif;background:#f5f6f8;color:#152038;display:grid;place-items:center;min-height:100vh}p{color:#5d6780}</style>
</head>
<body>
<p id="msg">載入中…</p>
<script>
/* 空殼：版面同資料都由 Supabase 讀取，改版面唔使再上傳呢個檔案。
   快取優先：有上次快取就即時出(唔等網絡,順滑唔頓)；
   同時喺背景攞最新版,如有更新就靜靜更新快取,下次入即見新版。
   冇快取(首次)先等網絡。 */
(function(){
  var URL="https://nikijysochwdfcqscgby.supabase.co/rest/v1/kids_events?id=eq.layout&select=data",
      KEY="sb_publishable_CXS1oAAM1sTtfalOTFMOTA_FSZwA4gU", CK="kidsLayout";
  function show(html){document.open();document.write(html);document.close();}
  var cached=null; try{cached=localStorage.getItem(CK);}catch(e){}
  var done=false;
  // 有快取：下一個 tick(解析完)即出,唔等 350ms,消除「載入中…」閃動
  if(cached){ setTimeout(function(){ if(!done){done=true;show(cached);} }, 0); }
  fetch(URL,{headers:{apikey:KEY}})
    .then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
    .then(function(rows){var h=rows&&rows[0]&&rows[0].data&&rows[0].data.html;if(!h)throw new Error("empty");
      var changed=(h!==cached);
      try{localStorage.setItem(CK,h);}catch(e){}
      if(!done){done=true;show(h);} else if(changed){done=true;show(h);} })   // 快取出咗但內容有更新 → 即刻重畫最新版,唔使 refresh 兩次
    .catch(function(){
      if(!done){done=true;
        if(cached)show(cached);
        else document.getElementById("msg").textContent="資料暫時載入唔到，請稍後再試。";} });
})();
</script>
</body>
</html>
