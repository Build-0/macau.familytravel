<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>仁仁德德去邊度</title>
<style>body{margin:0;font:15px "Noto Sans TC","PingFang TC",system-ui,sans-serif;background:#eef2f8;color:#152038;display:grid;place-items:center;min-height:100vh}p{color:#5d6780}</style>
</head>
<body>
<p id="msg">載入中…</p>
<script>
/* 空殼：版面同資料都由 Supabase 讀取，改版面唔使再上傳呢個檔案 */
(function(){
  var URL="https://nikijysochwdfcqscgby.supabase.co/rest/v1/kids_events?id=eq.layout&select=data",
      KEY="sb_publishable_CXS1oAAM1sTtfalOTFMOTA_FSZwA4gU", CK="kidsLayout";
  function show(html){document.open();document.write(html);document.close();}
  fetch(URL,{cache:"no-store",headers:{apikey:KEY}})
    .then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
    .then(function(rows){var h=rows&&rows[0]&&rows[0].data&&rows[0].data.html;if(!h)throw new Error("empty");
      try{localStorage.setItem(CK,h);}catch(e){} show(h);})
    .catch(function(){var h=null;try{h=localStorage.getItem(CK);}catch(e){}
      if(h)show(h);else document.getElementById("msg").textContent="資料暫時載入唔到，請稍後再試。";});
})();
</script>
</body>
</html>
