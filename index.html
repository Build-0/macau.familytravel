<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我們這一家</title>
<meta name="description" content="全家玩樂入口:澳門周邊、台灣、仁仁德德去哪裡、旅遊行程">
<meta name="theme-color" content="#f5f6f8">
<link rel="manifest" href="/macau.familytravel/manifest.json">
<link rel="apple-touch-icon" href="/macau.familytravel/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="我們這一家">
<link rel="prefetch" href="macau/index.html">
<link rel="prefetch" href="tw/index.html">
<link rel="prefetch" href="kids/index.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700;900&display=swap">
<style>
:root{
  --paper:#f5f6f8; --ink:#171f2c; --soft:#5a6678; --mute:#93a0b0; --line:#e6e7ea; --card:#fff;
  --serif:'Noto Serif TC',serif; --sans:'Noto Sans TC',sans-serif;
  --macau1:#ffb259; --macau2:#f2622c; --tw1:#2fc8a4; --tw2:#068a8f;
  --kids1:#5b8cf0; --kids2:#2746c2; --trip1:#b57cf0; --trip2:#7b3dc4;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
main{max-width:1120px;margin:0 auto;padding:clamp(30px,6vw,64px) clamp(18px,5vw,40px) calc(60px + env(safe-area-inset-bottom))}

/* HERO */
.over{font-size:12.5px;font-weight:900;letter-spacing:.3em;color:var(--macau2);text-transform:uppercase;margin:0 0 14px}
h1{font-family:var(--serif);font-weight:900;font-size:clamp(44px,9.5vw,78px);line-height:1.02;letter-spacing:-.01em;margin:0}
h1 .dot{color:var(--macau2)}
.lead{font-size:clamp(16px,2.4vw,20px);color:var(--soft);margin:16px 0 0;max-width:30ch}
.rule{height:3px;width:60px;background:var(--macau2);margin:20px 0 22px;border-radius:3px}
.lab{font-size:12px;font-weight:900;letter-spacing:.2em;color:var(--mute);text-transform:uppercase;margin:0 0 16px}

/* DESTINATIONS — 2×2 正方形 */
.dests{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(min-width:560px){.dests{gap:18px}}
/* 桌面闊螢幕:四張卡一行,卡唔會變巨型 */
@media(min-width:880px){.dests{grid-template-columns:repeat(4,1fr);gap:20px}}
.d{position:relative;display:flex;flex-direction:column;text-decoration:none;color:inherit;
   aspect-ratio:1/1;border-radius:20px;overflow:hidden;padding:18px 18px 18px 24px;background:var(--card);
   box-shadow:0 10px 26px rgba(23,31,44,.09);transition:transform .18s ease,box-shadow .18s ease}
.d:hover{transform:translateY(-4px);box-shadow:0 20px 44px rgba(23,31,44,.16)}
.d:active{transform:translateY(-1px)}
.d .bar{position:absolute;left:0;top:0;bottom:0;width:7px;background:linear-gradient(180deg,var(--c1),var(--c2))}
.d .num{position:absolute;right:14px;bottom:8px;font-family:var(--serif);font-weight:900;font-size:clamp(46px,13vw,76px);line-height:1;color:var(--c2);opacity:.15;pointer-events:none}
.d .k{align-self:flex-start;background:var(--c2);color:#fff;font-size:11px;font-weight:900;letter-spacing:.08em;
      padding:5px 10px;border-radius:999px;text-transform:uppercase}
.d h2{position:relative;font-family:var(--serif);font-weight:900;font-size:clamp(20px,5.6vw,27px);line-height:1.2;margin:auto 0 0}
.d .arw{position:relative;margin-top:10px;font-weight:900;color:var(--c2);font-size:13.5px}

/* TRIPS */
.sec{margin:54px 0 18px;scroll-margin-top:16px}
.sec h3{font-family:var(--serif);font-weight:900;font-size:26px;margin:0}
.trips{display:grid;grid-template-columns:1fr;gap:18px}
@media(min-width:720px){.trips{grid-template-columns:1fr 1fr}}
.trip{display:block;text-decoration:none;color:inherit;background:var(--card);border-radius:20px;overflow:hidden;
      box-shadow:0 10px 26px rgba(23,31,44,.09);transition:transform .18s,box-shadow .18s}
.trip:hover{transform:translateY(-4px);box-shadow:0 20px 44px rgba(23,31,44,.16)}
.trip .ph{aspect-ratio:16/10;background:#e7e0d2 center/cover no-repeat;display:block}
.trip .tx{padding:16px 18px 18px}
.trip .tg{display:inline-block;background:#fdeee6;color:var(--macau2);font-size:11px;font-weight:900;letter-spacing:.08em;padding:4px 9px;border-radius:999px;text-transform:uppercase}
.trip b{display:block;font-family:var(--serif);font-weight:700;font-size:19px;line-height:1.35;margin:9px 0 4px}
.trip small{display:block;color:var(--soft);font-size:14px;line-height:1.5}
.trip .none{padding:22px 18px;color:var(--mute)}
footer{margin-top:50px;font-size:13px;color:var(--mute);text-align:center;border-top:1px solid var(--line);padding-top:22px}
</style>
</head>
<body>
<main>
  <p class="over">Family · 全家玩樂入口</p>
  <h1>我們這一家<span class="dot">.</span></h1>
  <div class="rule"></div>

  <p class="lab">四個玩樂入口</p>
  <section class="dests">
    <a class="d" href="macau/" style="--c1:var(--macau1);--c2:var(--macau2)">
      <span class="bar"></span><span class="num">01</span>
      <span class="k">澳門出發</span>
      <h2>澳門周邊<br>親子遊</h2>
      <span class="arw">睇景點 →</span>
    </a>
    <a class="d" href="tw/" style="--c1:var(--tw1);--c2:var(--tw2)">
      <span class="bar"></span><span class="num">02</span>
      <span class="k">台灣</span>
      <h2>全家玩轉<br>寶島</h2>
      <span class="arw">睇寶島 →</span>
    </a>
    <a class="d" href="kids/" style="--c1:var(--kids1);--c2:var(--kids2)">
      <span class="bar"></span><span class="num">03</span>
      <span class="k">仁仁德德</span>
      <h2>去哪裡</h2>
      <span class="arw">睇活動 →</span>
    </a>
    <a class="d" href="trip/#/trips" style="--c1:var(--trip1);--c2:var(--trip2)">
      <span class="bar"></span><span class="num">04</span>
      <span class="k">旅遊行程</span>
      <h2>精選<br>行程</h2>
      <span class="arw">睇行程 →</span>
    </a>
  </section>

  <footer>票價、班次、開放時間可能更改，出發前請以官方公告為準。<br><span id="ver" style="display:inline-block;margin-top:10px;font-size:12px;color:var(--mute);letter-spacing:.03em"></span></footer>
</main>
<script>
// 「精選行程」入口直接連去行程一覽(#/trips);加／發布行程自動多卡,呢度唔使改。
// 預取 trip SPA 嘅 JS/CSS(背景載定,撳 04 卡入 trip 就唔使等 bundle download,減少成版 reload 嘅窒)
(function(){
  function warm(){
    fetch('trip/index.html',{cache:'force-cache'})
     .then(function(r){return r.ok?r.text():Promise.reject()})
     .then(function(html){
       var urls=[], m, re=/(?:src|href)="([^"]+\.(?:js|css))"/g;
       while((m=re.exec(html))){ urls.push(m[1]); }
       urls.slice(0,12).forEach(function(u){
         var abs = u.charAt(0)==='/' ? u : 'trip/'+u.replace(/^\.?\//,'');
         var l=document.createElement('link');
         l.rel = /\.css$/.test(u) ? 'prefetch' : 'modulepreload';
         l.href = abs; if(l.rel==='prefetch') l.as='style';
         document.head.appendChild(l);
       });
     }).catch(function(){});
  }
  if('requestIdleCallback' in window) requestIdleCallback(warm,{timeout:2500}); else setTimeout(warm,1200);
})();
// 版本標記:自動顯示本頁最後更新時間(Benny 要:呢個時間係「有改動」嘅標記,一定要保留)
(function(){
  var el=document.getElementById('ver'); if(!el) return;
  var d=new Date(document.lastModified); if(isNaN(d)) return;
  var p=function(n){return(n<10?'0':'')+n;};
  el.textContent='版本 '+d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
})();
</script>
<script>
/* 版本更新偵測:伺服器最新版本比本頁新就彈提示(切返 tab / 定時 check) */
(function(){
  var myLM = Date.parse(document.lastModified) || Date.now(), notified = false;
  function fmt(ms){var d=new Date(ms);if(isNaN(d))return '—';var p=function(n){return(n<10?'0':'')+n;};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());}
  function modal(cur,latest){
    if(document.getElementById('upd-modal'))return;
    var ov=document.createElement('div');ov.id='upd-modal';ov.setAttribute('role','alertdialog');
    ov.style.cssText="position:fixed;inset:0;z-index:2147483647;background:rgba(20,30,50,.4);display:flex;align-items:center;justify-content:center;padding:20px;font-family:'Noto Sans TC','PingFang TC',system-ui,sans-serif";
    var row=function(k,v){return '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;background:#f1f3f7;border-radius:10px;padding:10px 14px;font-size:14px"><span style="color:#5d6780">'+k+'</span><b style="color:#152038;font-variant-numeric:tabular-nums">'+v+'</b></div>';};
    var c=document.createElement('div');
    c.style.cssText="background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);padding:24px 22px;width:300px;max-width:92vw;text-align:center";
    c.innerHTML='<div style="font-size:30px;line-height:1;color:#2b4c7e;margin-bottom:10px">↻</div><div style="font-size:18px;font-weight:800;margin-bottom:16px;color:#152038">有新版本</div><div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px">'+row('目前',cur)+row('最新',latest)+'</div>';
    var g=document.createElement('button');g.textContent='立即更新';
    g.style.cssText="display:block;width:100%;padding:12px;border:0;border-radius:12px;background:#1f4f9c;color:#fff;font:700 15px/1 inherit;cursor:pointer;margin-bottom:8px";
    g.onclick=function(){location.replace(location.pathname+'?r='+Date.now()+location.hash);};
    var l=document.createElement('button');l.textContent='稍後';
    l.style.cssText="display:block;width:100%;padding:12px;border:0;border-radius:12px;background:#eef1f6;color:#5d6780;font:700 15px/1 inherit;cursor:pointer";
    l.onclick=function(){ov.remove();};
    c.appendChild(g);c.appendChild(l);ov.appendChild(c);document.body.appendChild(ov);
  }
  function check(){
    if(notified||document.hidden) return;
    fetch(location.pathname+location.search,{cache:'no-store',method:'HEAD'})
      .then(function(r){var lm=Date.parse(r.headers.get('last-modified'));if(lm&&lm>myLM+2000){notified=true;modal(fmt(myLM),fmt(lm));}})
      .catch(function(){});
  }
  document.addEventListener('visibilitychange',function(){if(!document.hidden)check();});
  setInterval(check,60000); setTimeout(check,8000);
})();
</script>
</body>
</html>
