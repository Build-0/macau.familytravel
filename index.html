<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我們這一家</title>
<meta name="description" content="全家玩樂入口:澳門周邊、台灣、仁仁德德去哪裡、旅遊行程">
<meta name="theme-color" content="#faf7f1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700;900&display=swap">
<style>
:root{
  --paper:#faf7f1; --ink:#1a2230; --soft:#55637a; --mute:#8a96a8; --line:#ece6da; --card:#fff;
  --serif:'Noto Serif TC',serif; --sans:'Noto Sans TC',sans-serif;
  --macau1:#ff9f43; --macau2:#ff6b35; --tw1:#2bc4a0; --tw2:#0a9ea0; --kids1:#4f86e0; --kids2:#2a57b8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
main{max-width:1040px;margin:0 auto;padding:clamp(28px,6vw,64px) clamp(18px,5vw,40px) calc(60px + env(safe-area-inset-bottom))}

/* HERO */
.over{font-size:12.5px;font-weight:900;letter-spacing:.32em;color:var(--macau2);text-transform:uppercase;margin:0 0 14px}
h1{font-family:var(--serif);font-weight:900;font-size:clamp(42px,9vw,76px);line-height:1.04;letter-spacing:-.01em;margin:0}
h1 .dot{color:var(--macau2)}
.lead{font-size:clamp(16px,2.4vw,20px);color:var(--soft);margin:16px 0 0;max-width:30ch}
.rule{height:2px;width:72px;background:var(--ink);margin:30px 0 40px;border-radius:2px}

/* DESTINATIONS */
.dests{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:720px){.dests{grid-template-columns:1fr 1fr}.dests .d:first-child{grid-column:1/-1}}
.d{position:relative;display:block;text-decoration:none;color:inherit;border-radius:22px;overflow:hidden;
   padding:26px 24px;min-height:152px;border:1px solid var(--line);background:var(--card);
   transition:transform .18s ease,box-shadow .18s ease}
.d:first-child{min-height:198px}
.d:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(26,34,48,.12)}
.d:active{transform:translateY(0)}
.d .wash{position:absolute;inset:0;opacity:.14;background:linear-gradient(135deg,var(--c1),var(--c2))}
.d .num{position:absolute;right:16px;bottom:-16px;font-family:var(--serif);font-weight:900;font-size:120px;line-height:1;color:var(--c2);opacity:.12}
.d .k{position:relative;font-size:12.5px;font-weight:900;letter-spacing:.14em;color:var(--c2);text-transform:uppercase}
.d h2{position:relative;font-family:var(--serif);font-weight:900;font-size:clamp(24px,4.6vw,34px);line-height:1.2;margin:8px 0}
.d p{position:relative;margin:0;color:var(--soft);font-size:15px;max-width:42ch}
.d .arw{position:relative;display:inline-flex;margin-top:16px;font-weight:800;color:var(--c2);font-size:14.5px}

/* TRIPS */
.sec{display:flex;align-items:baseline;gap:14px;margin:52px 0 20px}
.sec h3{font-family:var(--serif);font-weight:900;font-size:24px;margin:0}
.sec .ln{flex:1;height:1px;background:var(--line)}
.trips{display:grid;grid-template-columns:1fr;gap:18px}
@media(min-width:720px){.trips{grid-template-columns:1fr 1fr}}
.trip{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;transition:transform .18s,box-shadow .18s}
.trip:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(26,34,48,.12)}
.trip .ph{aspect-ratio:16/10;background:#e7e0d2 center/cover no-repeat;display:block}
.trip .tx{padding:16px 18px 18px}
.trip .tg{font-size:11.5px;font-weight:900;letter-spacing:.1em;color:var(--macau2);text-transform:uppercase}
.trip b{display:block;font-family:var(--serif);font-weight:700;font-size:19px;line-height:1.35;margin:6px 0 4px}
.trip small{display:block;color:var(--soft);font-size:14px;line-height:1.5}
.trip .none{padding:22px 18px;color:var(--mute)}
footer{margin-top:48px;font-size:13px;color:var(--mute);text-align:center;border-top:1px solid var(--line);padding-top:22px}
</style>
</head>
<body>
<main>
  <p class="over">Family · 全家玩樂入口</p>
  <h1>我們這一家<span class="dot">.</span></h1>
  <p class="lead">去邊度、玩咩、點去 —— 一個入口，全家搞掂。</p>
  <div class="rule"></div>

  <section class="dests">
    <a class="d" href="macau/" style="--c1:var(--macau1);--c2:var(--macau2)">
      <span class="wash"></span><span class="num">01</span>
      <span class="k">澳門出發</span>
      <h2>澳門周邊親子遊</h2>
      <p>珠海、中山、廣州、佛山等地景點，可按地區、偏好、類型、季節篩選。</p>
      <span class="arw">睇景點 →</span>
    </a>
    <a class="d" href="tw/" style="--c1:var(--tw1);--c2:var(--tw2)">
      <span class="wash"></span><span class="num">02</span>
      <span class="k">台灣</span>
      <h2>全家玩轉寶島</h2>
      <p>景點、美食、伴手禮，地圖分區睇，仲可以規劃景點之間嘅交通。</p>
      <span class="arw">睇寶島 →</span>
    </a>
    <a class="d" href="kids/" style="--c1:var(--kids1);--c2:var(--kids2)">
      <span class="wash"></span><span class="num">03</span>
      <span class="k">仁仁德德</span>
      <h2>去哪裡</h2>
      <p>適合仁仁、德德嘅活動，分「要報名」同「現場參加」。</p>
      <span class="arw">睇活動 →</span>
    </a>
  </section>

  <div class="sec"><h3>旅遊行程</h3><span class="ln"></span></div>
  <div class="trips" id="trips"><div class="trip"><div class="none">載入中…</div></div></div>

  <footer>票價、班次、開放時間可能更改，出發前請以官方公告為準。</footer>
</main>
<script>
// 行程列表:讀取已公開嘅行程(任何人都睇到,同行程頁一樣只讀「已發布」)
(function(){
  var SB='https://nikijysochwdfcqscgby.supabase.co';
  var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5pa2lqeXNvY2h3ZGZjcXNjZ2J5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MzQ2MTYsImV4cCI6MjEwODExMDYxNn0.1QDaEfWr9HgI5_jd_SGSca9m95arRFcYi22Xtacb_5s';
  var TRIP_BASE='t/';
  var box=document.getElementById('trips');
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  fetch(SB+'/rest/v1/trips?select=slug,title,data&published=eq.true&order=updated_at.desc',{headers:{apikey:KEY,Authorization:'Bearer '+KEY}})
   .then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
   .then(function(rows){
     if(!rows.length){box.innerHTML='<div class="trip"><div class="none">暫時未有公開行程。</div></div>';return}
     box.innerHTML=rows.map(function(t){var c=(t.data&&t.data.cover)||{};var tags=(c.tags||[]).join(' · ');
       var ph=c.image?'<span class="ph" style="background-image:url(\''+esc(c.image)+'\')"></span>':'';
       return '<a class="trip" href="'+TRIP_BASE+encodeURIComponent(t.slug)+'/">'+ph+'<div class="tx">'+(tags?'<div class="tg">'+esc(tags)+'</div>':'')+'<b>'+esc(t.title)+'</b><small>'+esc(c.subtitle||'')+'</small></div></a>'}).join('')
   })
   .catch(function(){box.innerHTML='<div class="trip"><div class="none">行程載入失敗，請稍後重新整理。</div></div>'});
})();
</script>
</body>
</html>
