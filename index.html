<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我們這一家</title>
<meta name="description" content="全家玩樂入口:澳門周邊、台灣、仁仁德德去哪裡、旅遊行程">
<meta name="theme-color" content="#f8f5ef">
<style>
:root { --ink:#1d2a3a; --soft:#4f5f71; --mute:#7d8b9a; --paper:#f8f5ef; --card:#fff; --line:#e4dfd2; --coral:#c9502a; }
* { box-sizing: border-box; }
body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.6 -apple-system,BlinkMacSystemFont,'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif; -webkit-text-size-adjust:100%; }
main { max-width:880px; margin:0 auto; padding:28px 18px calc(40px + env(safe-area-inset-bottom)); }
h1 { font-family:'Noto Serif TC','Songti TC','PMingLiU',Georgia,serif; font-size:30px; line-height:1.3; margin:0; }
.sub { color:var(--soft); margin:6px 0 22px; }
.grid { display:grid; grid-template-columns:1fr; gap:12px; }
a.card { display:block; text-decoration:none; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; }
a.card:active { background:#faf8f3; }
.card .k { font-size:13px; font-weight:800; letter-spacing:.08em; color:var(--coral); }
.card h2 { font-family:'Noto Serif TC','Songti TC','PMingLiU',Georgia,serif; font-size:21px; line-height:1.35; margin:2px 0 3px; }
.card p { margin:0; color:var(--soft); font-size:14.5px; line-height:1.55; }
.card .go { float:right; color:var(--mute); font-size:22px; line-height:1; margin-top:6px; }
h3 { font-size:14px; letter-spacing:.14em; color:var(--mute); margin:28px 0 10px; font-weight:800; }
.trips { list-style:none; margin:0; padding:0; background:var(--card); border:1px solid var(--line); border-radius:14px; }
.trips li + li { border-top:1px solid var(--line); }
.trips a { display:block; padding:12px 18px; text-decoration:none; color:inherit; }
.trips b { display:block; font-size:16.5px; line-height:1.45; }
.trips small { display:block; color:var(--soft); font-size:14px; line-height:1.5; margin-top:1px; }
.trips .none { padding:12px 18px; color:var(--mute); font-size:14.5px; }
footer { margin-top:30px; font-size:13px; color:var(--mute); text-align:center; }
@media (min-width:700px) { h1 { font-size:36px; } .grid { grid-template-columns:1fr 1fr; gap:14px; } }
</style>
</head>
<body>
<main>
  <h1>我們這一家</h1>
  <p class="sub">全家玩樂入口:去邊度、玩咩、點去。</p>

  <div class="grid">
    <a class="card" href="macau/"><span class="go">›</span><span class="k">澳門出發</span><h2>澳門周邊親子遊</h2><p>珠海、中山、廣州、佛山等地景點,可按地區、偏好、類型、季節篩選。</p></a>
    <a class="card" href="tw/"><span class="go">›</span><span class="k">台灣</span><h2>全家玩轉寶島</h2><p>景點、美食、伴手禮,地圖加分區睇,仲可以規劃景點之間嘅交通。</p></a>
    <a class="card" href="kids/"><span class="go">›</span><span class="k">仁仁德德</span><h2>去哪裡</h2><p>適合仁仁、德德嘅活動,分「要報名」同「現場參加」。</p></a>
  </div>

  <h3>旅遊行程</h3>
  <ul class="trips" id="trips"><li class="none">載入中…</li></ul>

  <footer>票價、班次、開放時間可能更改,出發前請以官方公告為準。</footer>
</main>
<script>
// 行程列表:讀取已公開嘅行程(任何人都睇到,同行程頁一樣只讀「已發布」)
(function () {
  var SB = 'https://fdnflasdjcnqldtyqkha.supabase.co';
  var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZkbmZsYXNkamNucWxkdHlxa2hhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5MjY4NjUsImV4cCI6MjA5OTUwMjg2NX0.NnVQ75pW5uYkoOwg365PILiAU7HfJCovukoBO9XNl-c';
  // 行程分享頁(有 WhatsApp 預覽卡,開啟後跳去行程頁)
  var TRIP_BASE = 't/';
  var ul = document.getElementById('trips');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  fetch(SB + '/rest/v1/trips?select=slug,title,data&published=eq.true&order=updated_at.desc', { headers: { apikey: KEY, Authorization: 'Bearer ' + KEY } })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (rows) {
      if (!rows.length) { ul.innerHTML = '<li class="none">暫時未有公開行程。</li>'; return; }
      ul.innerHTML = rows.map(function (t) {
        var c = (t.data && t.data.cover) || {};
        var tags = (c.tags || []).join(' · ');
        return '<li><a href="' + TRIP_BASE + encodeURIComponent(t.slug) + '/"><b>' + esc(t.title) + '</b><small>' + esc(c.subtitle || tags) + '</small></a></li>';
      }).join('');
    })
    .catch(function () { ul.innerHTML = '<li class="none">行程載入失敗,請稍後重新整理。</li>'; });
})();
</script>
</body>
</html>
